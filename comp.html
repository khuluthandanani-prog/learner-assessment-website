<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competitions | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tiles.css"></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>COMPETITIONS</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main><a class="back" href="learner.html">← Home</a><h2>Competitions</h2><div id="list" class="boxes"></div></main>
<script src="app.js"></script><script>
const u=guard('learner');
async function render(){try{const d=await api('/comp/me');
 const taken=d.regs.filter(r=>r.status!=='rejected').map(r=>r.subject),free=d.subjects.filter(s=>!taken.includes(s));
 let h=free.length?`<div class="card"><h3>🏅 Register for a competition</h3><form id="rg"><label>Subject</label><select name="sub">${free.map(s=>`<option>${s}</option>`).join('')}</select><label>School report (max 1.5MB)</label><input name="sr" type="file" required><label>RISE COLLECTIVE marks report (max 1.5MB)</label><input name="rr" type="file" required><p class="m">Joining fee: R${d.fee}. You get a payment reference after registering.</p><button class="btn">Register</button></form></div>`:'';
 h+=d.regs.map(r=>{const st=r.status;return `<div class="card"><div class="row"><h3>${esc(r.subject)}</h3><span class="tag ${st==='approved'?'ok':st==='pending'?'warn':'bad'}">${st}</span></div><p class="m">Registered ${fmt(r.at)}</p><p>Reference: <b>${esc(r.reference)}</b></p>${st==='pending'?`<p>Pay R${esc(r.amount)} with this reference:</p><p style="white-space:pre-wrap">${esc(d.instructions)}</p><p class="m">The admin approves your entry after the payment is confirmed.</p>`:''}${st==='approved'?'<p>You are in! Your papers appear in the boxes below.</p>':''}${st==='rejected'?'<p>This registration was not accepted. You can register again.</p>':''}</div>`}).join('');
 h+=d.papers.map(p=>{const s=d.subs.find(x=>x.pid===p.id),closed=new Date(p.due)<new Date(),marked=s&&s.mark!=null;
  const tag=marked?`<span class="tag ok">Marked ${s.mark}/${p.total}</span>`:s?'<span class="tag">Submitted</span>':closed?'<span class="tag bad">Closed</span>':'<span class="tag warn">Open</span>';
  return `<div class="card"><div class="row"><h3>${esc(p.title)}</h3>${tag}</div><p class="m">${esc(p.subject)} · Due ${fmt(p.due)} · ${p.total} marks</p><p>${esc(p.desc)}</p>${fileLink(p.file)}${s?`<p class="m">Submitted ${fmt(s.at)} ${fileLink(s.file)}</p>`:''}${s&&s.feedback?`<div class="fb"><b>Feedback:</b> ${esc(s.feedback)}</div>`:''}${marked||closed?'':`<details><summary>${s?'Resubmit':'Submit work'}</summary><form data-pid="${p.id}"><textarea name="t" placeholder="Comments / answer (optional)">${esc(s?s.text:'')}</textarea><input type="file" name="f"><button class="btn">Submit</button></form></details>`}</div>`}).join('');
 if(!h)h='<p class="m">Nothing here yet.</p>';
 $('#list').innerHTML=h}catch(e){$('#list').innerHTML='<div class="card"><b>Unable to load.</b><p>'+esc(e.message)+'</p></div>'}}
document.addEventListener('submit',async e=>{
 if(e.target.id==='rg'){e.preventDefault();const f=e.target.elements;let sr,rr;try{sr=await readFile(f.sr.files[0]);rr=await readFile(f.rr.files[0])}catch(x){return alert(x)}
  if(!sr||!rr)return alert('Upload both reports.');
  try{const x=await api('/comp/register',{method:'POST',body:JSON.stringify({subject:f.sub.value,schoolReport:sr,riseReport:rr})});alert('Registered! Your payment reference is '+x.reference);render()}catch(x){alert(x.message)}return}
 if(e.target.matches('form[data-pid]')){e.preventDefault();const f=e.target.elements;let file;try{file=await readFile(f.f.files[0])}catch(x){return alert(x)}
  try{await api('/comp/submit',{method:'POST',body:JSON.stringify({pid:e.target.dataset.pid,text:f.t.value,file})});alert('Submitted!');render()}catch(x){alert(x.message)}}});
render();
</script></body></html>
