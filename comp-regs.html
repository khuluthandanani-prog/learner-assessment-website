<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competition Registrations | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tiles.css"></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>COMPETITION REGISTRATIONS</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main><a class="back" href="lecturer.html">← Home</a><h2>Competition Registrations</h2><p id="info"></p><div id="list"></div></main>
<script src="app.js"></script><script>
const u=guard('admin');if(u&&u.role!=='admin')location.href='lecturer.html';
async function render(){try{const d=await api('/comp/regs');$('#info').textContent='Joining fee: R'+d.fee+'. Approve an entry only after you have seen the payment with its reference and checked both reports.';
 $('#list').innerHTML=d.regs.length?`<div class="card"><div class="table"><table><tr><th>Student number</th><th>Email</th><th>Subject</th><th>Reference</th><th>Amount</th><th>Status</th><th>Registered</th><th>Reports</th><th>Actions</th></tr>${d.regs.map(r=>{const st=r.status;return `<tr><td>${esc(r.studentNumber||'—')}</td><td>${esc(r.email)}</td><td>${esc(r.subject)}</td><td><b>${esc(r.reference)}</b></td><td>R${esc(r.amount)}</td><td><span class="tag ${st==='approved'?'ok':st==='pending'?'warn':'bad'}">${st}</span></td><td>${fmt(r.at)}</td><td><button class="btn sm ghost" onclick="dl('${r.id}','school')">School report</button> <button class="btn sm ghost" onclick="dl('${r.id}','rise')">RISE marks</button></td><td>${st!=='approved'?`<button class="btn sm" onclick="act('${r.id}','approve')">Approve</button>`:''} ${st==='pending'?`<button class="btn sm ghost" onclick="act('${r.id}','reject')">Reject</button>`:''}${st==='approved'?`<button class="btn sm ghost" onclick="act('${r.id}','reject')">Remove</button>`:''}</td></tr>`}).join('')}</table></div></div>`:'<p class="m">No competition registrations yet.</p>'}catch(e){$('#list').innerHTML='<div class="card"><b>Unable to load.</b><p>'+esc(e.message)+'</p></div>'}}
async function dl(id,which){try{const d=await api('/comp/regs/'+id+'/file/'+which);const a=document.createElement('a');a.href=d.data;a.download=d.name;document.body.appendChild(a);a.click();a.remove()}catch(e){alert(e.message)}}
async function act(id,action){try{await api('/comp/regs/'+id,{method:'PATCH',body:JSON.stringify({action})});render()}catch(e){alert(e.message)}}
render();
</script></body></html>
