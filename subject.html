<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subject | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tiles.css">
<style>
/* Read-only viewer */
#viewer{position:fixed;inset:0;z-index:9999;background:#1d1f24;display:none;flex-direction:column;-webkit-user-select:none;user-select:none}
#viewer.open{display:flex}
#viewer .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#14161a;color:#fff}
#viewer .bar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer .pages{flex:1;overflow:auto;padding:14px;text-align:center}
#viewer canvas{display:block;margin:0 auto 14px;max-width:100%;height:auto;background:#fff;pointer-events:none}
#viewer .msg{color:#fff;padding:24px;text-align:center}
.nt{-webkit-user-select:none;user-select:none}
/* Printing the page prints nothing */
@media print{body{display:none!important}}
</style></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>SUBJECT</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main><a class="back" href="subjects.html">← Subjects</a><h2 id="ttl"></h2>
<div id="top" class="boxes"></div><h2>🎥 Videos</h2><div id="vl" class="boxes"></div><h2>📄 Notes</h2><div id="nl" class="boxes"></div></main>

<div id="viewer" aria-hidden="true">
  <div class="bar"><b id="vTitle"></b><button class="btn sm" id="vClose">Close</button></div>
  <div class="pages" id="vPages"></div>
</div>

<script src="app.js"></script><script>
const u=session();if(!u)location.href='index.html';else $('#who').textContent=u.name;
const S=new URLSearchParams(location.search).get('s')||'';$('#ttl').textContent=S;document.title=S+' | RISE COLLECTIVE';
const staff=!!u&&u.role!=='learner';

/* ---------- Read-only viewer: draws the pages onto a canvas, with no download button ---------- */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfReady;
function loadPdfJs(){
  return pdfReady||(pdfReady=new Promise((ok,no)=>{
    const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';ok()};
    s.onerror=()=>{pdfReady=null;no(new Error('Could not load the viewer. Check your internet connection and try again.'))};
    document.head.appendChild(s);
  }));
}
function fileKind(f){
  const n=(f.name||'').toLowerCase(),m=/^data:([^;,]+)/.exec(f.data||''),t=m?m[1]:'';
  if(t==='application/pdf'||n.endsWith('.pdf'))return 'pdf';
  if(t.startsWith('image/')||/\.(png|jpe?g|gif|webp)$/.test(n))return 'img';
  return 'other';
}
function toBytes(data){
  const b64=data.startsWith('data:')?data.slice(data.indexOf(',')+1):data;
  const bin=atob(b64),a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return a;
}
// Faint diagonal name + date drawn INTO the page image, so a screenshot can be traced back to the learner
function stamp(c){
  const x=c.getContext('2d'),txt=(u.name||'Learner')+'  '+new Date().toLocaleDateString('en-ZA');
  x.save();x.globalAlpha=.13;x.fillStyle='#000';x.font=Math.max(16,Math.round(c.width/22))+'px sans-serif';x.textAlign='center';
  x.rotate(-Math.PI/6);
  for(let y=-c.width;y<c.height*1.6;y+=Math.round(c.width/4))
    for(let xx=-c.height;xx<c.width*1.2;xx+=Math.round(c.width/1.4))x.fillText(txt,xx,y);
  x.restore();
}
function openShell(title){
  const V=$('#viewer');
  $('#vTitle').textContent=title||'Notes';$('#vPages').innerHTML='<p class="msg">Loading…</p>';
  V.classList.add('open');V.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
}
async function showFile(f){
  const P=$('#vPages');
  try{
    const kind=fileKind(f);
    if(kind==='pdf'){
      await loadPdfJs();
      const pdf=await pdfjsLib.getDocument({data:toBytes(f.data)}).promise;
      P.innerHTML='';
      const w=Math.min(P.clientWidth-28,900),dpr=Math.min(window.devicePixelRatio||1,2);
      for(let i=1;i<=pdf.numPages;i++){
        const pg=await pdf.getPage(i),base=pg.getViewport({scale:1}),sc=w/base.width,vp=pg.getViewport({scale:sc*dpr});
        const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width=w+'px';
        P.appendChild(c);
        await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        stamp(c);
      }
    }else if(kind==='img'){
      const src=f.data.startsWith('data:')?f.data:'data:image/'+((f.name||'').split('.').pop().toLowerCase().replace('jpg','jpeg'))+';base64,'+f.data;
      const img=new Image();
      await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('This image could not be opened.'));img.src=src});
      const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
      c.getContext('2d').drawImage(img,0,0);stamp(c);P.innerHTML='';P.appendChild(c);
    }else{
      P.innerHTML='<p class="msg">This file type cannot be shown on the site. Ask your tutor to upload the notes as a PDF.</p>';
    }
  }catch(e){P.innerHTML='<p class="msg">'+esc(e.message||'Could not open this file.')+'</p>'}
}
function closeViewer(){
  const V=$('#viewer');V.classList.remove('open');V.setAttribute('aria-hidden','true');
  $('#vPages').innerHTML='';document.body.style.overflow='';
}
$('#vClose').addEventListener('click',closeViewer);
// Discourage saving and printing (this slows people down but cannot stop screenshots)
document.addEventListener('contextmenu',e=>{if(e.target.closest('#viewer')||e.target.closest('.nt'))e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeViewer();
  if($('#viewer').classList.contains('open')&&(e.ctrlKey||e.metaKey)&&['p','s','u'].includes(e.key.toLowerCase()))e.preventDefault();
});

/* ---------- Page ---------- */
function formBox(){return `<div class="card"><h3>➕ Add to ${esc(S)}</h3><form id="rf"><label>Title</label><input name="ttl" required><label>Type</label><select name="type" id="ty"><option value="note">Notes</option><option value="video">Video link</option></select><label>Description / notes text</label><textarea name="desc"></textarea><div id="vb" hidden><label>Video link</label><input name="url" placeholder="https://"></div><div id="fb"><label>Attach file (PDF or image, max 1.5MB)</label><input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/*"></div><button class="btn">Post</button><p class="m">Learners can only read notes on the site, and only with a weekly pass.</p></form></div>`}
async function passBox(){try{const p=await api('/pass/me');const days=p.days||Math.round(p.hours/24);let b;
 if(p.active)b=`<span class="tag ok">Weekly pass active</span><p class="m">Notes and videos unlocked until ${fmt(p.expiresAt)}</p>`;
 else if(p.pending)b=`<span class="tag warn">Waiting for payment confirmation</span><p>Pay R${p.price} and use this reference:</p><p><b>${esc(p.pending.reference)}</b></p><p style="white-space:pre-wrap">${esc(p.instructions)}</p><p class="m">An admin activates your pass once the payment is confirmed.</p>`;
 else b=`<p>Notes and videos need a weekly pass: R${p.price} for ${days} days.</p><button class="btn" onclick="getPass()">Get weekly pass</button>`;
 return `<div class="card"><h3>💳 Weekly pass</h3>${b}</div>`}catch(e){return ''}}
const card=r=>{const mine=u.role!=='tutor'||r.createdBy===u.id;
 let act='';
 if(r.type==='video')act=`<button class="btn sm" onclick="watch('${r.id}')">▶ Watch</button>`;
 else if(r.locked)act='<p class="m">🔒 Get a weekly pass to read this note.</p>';
 else if(r.fileName)act=`<button class="btn sm" onclick="readNote('${r.id}')">👁 Read ${esc(r.fileName)}</button>`;
 return `<div class="card"><div class="row"><h3>${r.type==='video'?'🎥':'📄'} ${esc(r.title)}</h3></div><p class="m">${esc(r.by||'')} · ${fmt(r.at)}</p><p class="${r.type==='note'?'nt':''}">${esc(r.desc)}</p>${act}${staff&&mine?` <button class="btn sm ghost" onclick="del('${r.id}')">Delete</button>`:''}</div>`};
async function render(){try{const d=await api('/resources?subject='+encodeURIComponent(S));
 $('#top').innerHTML=d.canPost?formBox():(staff?'':await passBox());
 $('#vl').innerHTML=d.resources.filter(r=>r.type==='video').map(card).join('')||'<p class="m">No videos yet.</p>';
 $('#nl').innerHTML=d.resources.filter(r=>r.type==='note').map(card).join('')||'<p class="m">No notes yet.</p>'}
 catch(e){$('#top').innerHTML='<div class="card"><b>Unable to open this subject.</b><p>'+esc(e.message)+'</p></div>'}}
async function getPass(){try{await api('/pass/request',{method:'POST',body:'{}'});render()}catch(e){alert(e.message)}}
async function watch(id){try{const d=await api('/resources/'+id+'/video');window.open(d.url,'_blank','noopener')}catch(e){alert(e.message)}}
async function readNote(id){
  try{const d=await api('/resources/'+id+'/file');openShell(d.name);await showFile(d)}
  catch(e){closeViewer();alert(e.message)}
}
async function del(id){if(!confirm('Delete this post?'))return;try{await api('/resources/'+id,{method:'DELETE'});render()}catch(e){alert(e.message)}}
document.addEventListener('change',e=>{if(e.target.id==='ty'){const v=e.target.value==='video';$('#vb').hidden=!v;$('#fb').hidden=v}});
document.addEventListener('submit',async e=>{if(e.target.id!=='rf')return;e.preventDefault();const f=e.target.elements;let file=null;try{file=await readFile(f.file.files[0])}catch(x){return alert(x)}
 try{await api('/resources',{method:'POST',body:JSON.stringify({subject:S,title:f.ttl.value,desc:f.desc.value,type:f.type.value,url:f.url.value,file})});render()}catch(x){alert(x.message)}});
render();
</script></body></html>
