<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sharing Report | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>SHARING REPORT</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main><a href="lecturer.html" style="display:inline-block;margin:0 0 14px">← Home</a><h2>Sharing Report</h2><p class="m" id="info"></p><div id="list"></div></main>
<script src="app.js"></script><script>
const u=guard('admin');if(u&&u.role!=='admin')location.href='lecturer.html';
async function render(){try{const d=await api('/admin/sharing');$('#info').textContent='A learner is flagged when videos were opened from '+d.maxIps+' or more internet addresses, or '+d.maxDevices+' or more devices, within '+d.hours+' hours.';
$('#list').innerHTML=d.learners.length?`<div class="card"><div class="table"><table><tr><th>Learner</th><th>Email</th><th>Videos opened</th><th>Internet addresses</th><th>Devices</th><th>Last opened</th><th>Status</th><th>Actions</th></tr>${d.learners.map(l=>`<tr ${l.flagged?'style="outline:2px solid #c0392b;outline-offset:-2px"':''}><td>${esc(l.name)}</td><td>${esc(l.email)}</td><td>${l.views}</td><td>${l.ips}</td><td>${l.devices}</td><td>${fmt(l.lastAt)}</td><td>${l.flagged?'<span class="tag bad">🚩 Flagged</span>':'<span class="tag ok">OK</span>'}</td><td><button class="btn sm ghost" onclick="showLog('${l.id}')">Details</button> <button class="btn sm ghost" onclick="revoke('${l.id}')">Stop day pass</button></td></tr><tr id="log${l.id}" hidden><td colspan="8"></td></tr>`).join('')}</table></div></div>`:'<p class="m">No video views in this period.</p>'}catch(e){$('#list').innerHTML='<div class="card"><b>Unable to load.</b><p>'+esc(e.message)+'</p></div>'}}
async function showLog(id){const row=$('#log'+id);if(!row.hidden){row.hidden=true;return}try{const d=await api('/admin/sharing/'+id);row.firstChild.innerHTML=d.log.length?d.log.map(l=>`<div class="m">${fmt(l.at)} · ${esc(l.title)} · ${esc(l.ip)} · ${esc(l.ua)}</div>`).join(''):'<span class="m">No views.</span>';row.hidden=false}catch(e){alert(e.message)}}
async function revoke(id){if(!confirm("Stop all of this learner's active day passes?"))return;try{await api('/admin/sharing/'+id+'/revoke',{method:'PATCH'});alert('Day pass stopped.');render()}catch(e){alert(e.message)}}
render();
</script></body></html>
