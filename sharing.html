<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sharing Report | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tiles.css"></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>SHARING REPORT</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main><a class="back" href="lecturer.html">← Home</a><h2>Sharing Report</h2><p class="m" id="info"></p><div id="list" class="boxes"></div></main>
<script src="app.js"></script><script>
const u=guard('admin');if(u&&u.role!=='admin')location.href='lecturer.html';
async function render(){try{const d=await api('/admin/sharing');$('#info').textContent='A learner is flagged when videos were opened from '+d.maxIps+' or more internet addresses, or '+d.maxDevices+' or more devices, within '+d.hours+' hours.';
$('#list').innerHTML=d.learners.length?d.learners.map(l=>`<div class="card" ${l.flagged?'style="border:2px solid #c0392b"':''}><div class="row"><h3>${esc(l.name)}</h3>${l.flagged?'<span class="tag bad">🚩 Flagged</span>':'<span class="tag ok">OK</span>'}</div><p class="m">${esc(l.email)}</p><p>Videos opened: <b>${l.views}</b></p><p>Internet addresses: <b>${l.ips}</b> · Devices: <b>${l.devices}</b></p><p class="m">Last opened: ${fmt(l.lastAt)}</p><p><button class="btn sm ghost" onclick="showLog('${l.id}')">Details</button> <button class="btn sm ghost" onclick="revoke('${l.id}')">Stop day pass</button></p><div id="log${l.id}" hidden></div></div>`).join(''):'<p class="m">No video views in this period.</p>'}catch(e){$('#list').innerHTML='<div class="card"><b>Unable to load.</b><p>'+esc(e.message)+'</p></div>'}}
async function showLog(id){const box=$('#log'+id);if(!box.hidden){box.hidden=true;return}try{const d=await api('/admin/sharing/'+id);box.innerHTML=d.log.map(l=>`<p class="m">${fmt(l.at)} · ${esc(l.title)}<br>${esc(l.ip)} · ${esc(l.ua)}</p>`).join('')||'<p class="m">No views.</p>';box.hidden=false}catch(e){alert(e.message)}}
async function revoke(id){if(!confirm("Stop all of this learner's active day passes?"))return;try{await api('/admin/sharing/'+id+'/revoke',{method:'PATCH'});alert('Day pass stopped.');render()}catch(e){alert(e.message)}}
render();
</script></body></html>
