<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competition Papers | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tiles.css"></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>COMPETITION PAPERS</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main><a class="back" href="lecturer.html">← Home</a><h2>Competition Papers</h2>
<div class="card"><h3>New competition paper</h3><form id="pf"><label>Subject</label><select name="sub" id="psub"></select><label>Title</label><input name="ttl" required><label>Instructions</label><textarea name="desc"></textarea><div class="row"><div><label>Total marks</label><input name="total" type="number" min="1" value="100" required></div><div><label>Deadline</label><input name="due" type="datetime-local" required></div></div><label>Attach paper (optional, max 1.5MB)</label><input name="file" type="file"><button class="btn">Publish</button></form></div>
<div id="pl" class="boxes"></div>
<h2>Mark submissions</h2><div id="ms" class="boxes"></div><div id="mt"></div>
<h2>Competition marks</h2><div id="mk"></div></main>
<script src="app.js"></script><script>
const u=guard('admin');if(u&&u.role==='tutor')location.href='lecturer.html';
let SUBS=[],KEYS=[],OPEN=null;
function openMs(i){OPEN=OPEN===KEYS[i]?null:KEYS[i];showMs()}
function showMs(){
 const g={};SUBS.forEach(x=>{const k=x.subject+' | '+x.title;(g[k]=g[k]||[]).push(x)});
 KEYS=Object.keys(g);
 if(OPEN&&!g[OPEN])OPEN=null;
 $('#ms').innerHTML=KEYS.map((k,i)=>{const a=g[k],m=a.filter(x=>x.mark!=null).length;return `<div class="card" style="cursor:pointer${OPEN===k?';outline:2px solid #888':''}" onclick="openMs(${i})"><h3>${esc(a[0].title)}</h3><p class="m">${esc(a[0].subject)} · ${a.length} submitted · ${m} marked</p><p class="m">${OPEN===k?'Click to close':'Click to mark'}</p></div>`}).join('')||'<p class="m">No submissions to mark.</p>';
 const a=g[OPEN];
 $('#mt').innerHTML=a?`<div class="card"><h3>${esc(a[0].title)} · ${esc(a[0].subject)}</h3><div class="table"><table><tr><th>Student number</th><th>Email</th><th>Submitted</th><th>Work</th><th>Mark</th><th>Feedback</th><th>Status</th></tr>${a.map(x=>`<tr><td>${esc(x.studentNumber||'—')}</td><td>${esc(x.email)}</td><td>${fmt(x.at)}</td><td>${esc(x.text).slice(0,80)} ${fileLink(x.file)}</td><td><input type="number" min="0" max="${x.total}" value="${x.mark==null?'':x.mark}" id="m${x.id}" style="width:70px"> /${x.total}</td><td><textarea id="f${x.id}" rows="2">${esc(x.feedback)}</textarea></td><td><span class="tag ${x.mark==null?'':'ok'}">${x.mark==null?'Submitted':'Marked'}</span> <button class="btn sm" onclick="save('${x.id}',${x.total})">Save</button></td></tr>`).join('')}</table></div></div>`:'';
}
async function render(){try{const d=await api('/comp/papers');
 $('#psub').innerHTML=d.subjects.map(s=>`<option>${esc(s)}</option>`).join('');
 $('#pl').innerHTML=d.papers.map(p=>`<div class="card"><div class="row"><h3>${esc(p.title)}</h3><span class="tag">${p.subs} submitted</span></div><p class="m">${esc(p.subject)} · Due ${fmt(p.due)} · ${p.total} marks</p><p>${esc(p.desc)}</p>${fileLink(p.file)} <button class="btn sm ghost" onclick="delP('${p.id}')">Delete</button></div>`).join('')||'<p class="m">No competition papers yet.</p>';
 const s=await api('/comp/subs');SUBS=s.subs;showMs();
 const m=await api('/comp/marks');
 $('#mk').innerHTML=m.marks.length?`<div class="card"><div class="table"><table><tr><th>Subject</th><th>Paper</th><th>Student number</th><th>Email</th><th>Mark</th></tr>${m.marks.map(x=>`<tr><td>${esc(x.subject)}</td><td>${esc(x.title)}</td><td>${esc(x.studentNumber||'—')}</td><td>${esc(x.email)}</td><td>${x.mark==null?'<span class="tag">Not marked</span>':x.mark+'/'+x.total}</td></tr>`).join('')}</table></div></div>`:'<p class="m">No submissions yet.</p>';
}catch(e){alert(e.message)}}
async function delP(id){if(!confirm('Delete this paper and its submissions?'))return;try{await api('/comp/papers/'+id,{method:'DELETE'});render()}catch(e){alert(e.message)}}
async function save(id,tot){const m=$('#m'+id).value;if(m===''||+m<0||+m>tot)return alert('Mark must be 0–'+tot);try{await api('/comp/subs/'+id,{method:'PATCH',body:JSON.stringify({mark:+m,feedback:$('#f'+id).value})});alert('Saved');render()}catch(e){alert(e.message)}}
$('#pf').onsubmit=async e=>{e.preventDefault();const f=e.target.elements;let file;try{file=await readFile(f.file.files[0])}catch(x){return alert(x)}
 try{await api('/comp/papers',{method:'POST',body:JSON.stringify({subject:f.sub.value,title:f.ttl.value,desc:f.desc.value,total:+f.total.value,due:f.due.value,file})});e.target.reset();render();alert('Paper published. Parents of registered competitors are told on WhatsApp.')}catch(x){alert(x.message)}};
render();
</script></body></html>
