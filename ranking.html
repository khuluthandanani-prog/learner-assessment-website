<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overall Ranking | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tiles.css">
<style>
.rk{width:100%;border-collapse:collapse;margin-top:12px}
.rk th,.rk td{padding:10px 8px;text-align:left;border-bottom:1px solid rgba(128,128,128,.25)}
.rk tr.me{background:rgba(59,130,246,.18);font-weight:700}
.rk .pos{font-weight:700;width:48px}
.wrap{overflow-x:auto}
.note{opacity:.8;font-size:.9rem;margin-top:8px}
</style></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>OVERALL RANKING</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main>
<p><a href="#" onclick="history.back();return false">← Back</a></p>
<h2>🏅 Overall Ranking</h2>
<p class="note">All learners, all assessments and competition papers together. Score = total marks earned ÷ total marks available.</p>
<div id="out" class="wrap">Loading…</div>
</main>
<script src="app.js"></script><script>
function findUser(){
  for(const store of [localStorage,sessionStorage]){
    for(let i=0;i<store.length;i++){
      try{const o=JSON.parse(store.getItem(store.key(i)));
        if(o&&typeof o==='object'&&o.id&&o.role)return o}catch(e){}
    }
  }
  return null;
}
const me=findUser();
if(!me){location.href='index.html'}
else{
  document.getElementById('who').textContent=me.name||'';
  (async()=>{
    const out=document.getElementById('out');
    try{
      const d=await api('/ranking/overall');
      if(!d.rows.length){out.textContent='No marks yet. The ranking appears once work has been marked.';return}
      const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const staff=!!d.rows[0].email;
      let h='<table class="rk"><tr><th>#</th><th>Learner</th>'+(staff?'<th>Student no.</th>':'')+'<th>School</th><th>Score</th><th>%</th></tr>';
      d.rows.forEach(r=>{
        h+='<tr class="'+(r.me?'me':'')+'"><td class="pos">'+r.rank+'</td><td>'+esc(r.name)+(r.me?' (you)':'')+'</td>'+(staff?'<td>'+esc(r.studentNumber)+'</td>':'')+'<td>'+esc(r.school)+'</td><td>'+r.got+' / '+r.outof+'</td><td>'+r.pct+'%</td></tr>';
      });
      h+='</table><p class="note">'+d.total+' learners ranked.</p>';
      out.innerHTML=h;
    }catch(e){out.textContent='Could not load the ranking: '+e.message}
  })();
}
</script></body></html>
