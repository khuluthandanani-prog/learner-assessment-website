<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assessments | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tiles.css">
<style>
/* Read-only viewer */
#viewer{position:fixed;inset:0;z-index:9999;background:#1d1f24;display:none;flex-direction:column;-webkit-user-select:none;user-select:none}
#viewer.open{display:flex}
#viewer .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#14161a;color:#fff}
#viewer .bar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer .pages{flex:1;overflow:auto;padding:14px;text-align:center}
#viewer canvas{display:block;margin:0 auto 14px;max-width:100%;height:auto;background:#fff;pointer-events:none}
#viewer .msg{color:#fff;padding:24px;text-align:center}
/* Printing the page prints nothing */
@media print{body{display:none!important}}
</style></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>LEARNER PORTAL</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main><a class="back" href="learner.html">← Home</a> · <a class="back" href="learner-marks.html">My Marks</a><h2>Assessments</h2><div id="list"></div></main>

<div id="viewer" aria-hidden="true">
  <div class="bar"><b id="vTitle"></b><button class="btn sm" id="vClose">Close</button></div>
  <div class="pages" id="vPages"></div>
</div>

<script src="app.js"></script><script>
const u=guard('learner');
const FILES={}; // assessment id -> file, kept here so the file contents are never written into the page HTML

/* ---------- Read-only viewer: draws the pages onto a canvas, with no download button ---------- */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfReady;
function loadPdfJs(){
  return pdfReady||(pdfReady=new Promise((ok,no)=>{
    const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';ok()};
    s.onerror=()=>{pdfReady=null;no(new Error('Could not load the viewer. Check your internet connection and try again.'))};
    document.head.appendChild(s);
  }));
}
function fileKind(f){
  const n=(f.name||'').toLowerCase(),m=/^data:([^;,]+)/.exec(f.data||''),t=m?m[1]:'';
  if(t==='application/pdf'||n.endsWith('.pdf'))return 'pdf';
  if(t.startsWith('image/')||/\.(png|jpe?g|gif|webp)$/.test(n))return 'img';
  return 'other';
}
function toBytes(data){
  const b64=data.startsWith('data:')?data.slice(data.indexOf(',')+1):data;
  const bin=atob(b64),a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return a;
}
// Faint diagonal name + date drawn INTO the page image, so a screenshot can be traced back to the learner
function stamp(c){
  const x=c.getContext('2d'),txt=(u.name||'Learner')+'  '+new Date().toLocaleDateString('en-ZA');
  x.save();x.globalAlpha=.13;x.fillStyle='#000';x.font=Math.max(16,Math.round(c.width/22))+'px sans-serif';x.textAlign='center';
  x.rotate(-Math.PI/6);
  for(let y=-c.width;y<c.height*1.6;y+=Math.round(c.width/4))
    for(let xx=-c.height;xx<c.width*1.2;xx+=Math.round(c.width/1.4))x.fillText(txt,xx,y);
  x.restore();
}
async function openViewer(id){
  const f=FILES[id];if(!f)return;
  const V=$('#viewer'),P=$('#vPages');
  $('#vTitle').textContent=f.name||'Assessment';P.innerHTML='<p class="msg">Loading…</p>';
  V.classList.add('open');V.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
  try{
    const kind=fileKind(f);
    if(kind==='pdf'){
      await loadPdfJs();
      const pdf=await pdfjsLib.getDocument({data:toBytes(f.data)}).promise;
      P.innerHTML='';
      const w=Math.min(P.clientWidth-28,900),dpr=Math.min(window.devicePixelRatio||1,2);
      for(let i=1;i<=pdf.numPages;i++){
        const pg=await pdf.getPage(i),base=pg.getViewport({scale:1}),sc=w/base.width,vp=pg.getViewport({scale:sc*dpr});
        const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width=w+'px';
        P.appendChild(c);
        await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        stamp(c);
      }
    }else if(kind==='img'){
      const src=f.data.startsWith('data:')?f.data:'data:image/'+((f.name||'').split('.').pop().toLowerCase().replace('jpg','jpeg'))+';base64,'+f.data;
      const img=new Image();
      await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('This image could not be opened.'));img.src=src});
      const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
      c.getContext('2d').drawImage(img,0,0);stamp(c);P.innerHTML='';P.appendChild(c);
    }else{
      P.innerHTML='<p class="msg">This file type cannot be shown on the site. Ask your tutor to upload the assessment as a PDF.</p>';
    }
  }catch(e){P.innerHTML='<p class="msg">'+esc(e.message||'Could not open this file.')+'</p>'}
}
function closeViewer(){
  const V=$('#viewer');V.classList.remove('open');V.setAttribute('aria-hidden','true');
  $('#vPages').innerHTML='';document.body.style.overflow='';
}
$('#vClose').addEventListener('click',closeViewer);
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)openViewer(b.dataset.view)});
// Discourage saving and printing while a file is open (this slows people down but cannot stop screenshots)
document.addEventListener('contextmenu',e=>{if(e.target.closest('#viewer'))e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeViewer();
  if($('#viewer').classList.contains('open')&&(e.ctrlKey||e.metaKey)&&['p','s','u'].includes(e.key.toLowerCase()))e.preventDefault();
});

const viewBtn=a=>a.file?`<p><button type="button" class="btn sm" data-view="${a.id}">👁 View assessment</button> <span class="m">${esc(a.file.name||'')} (read only)</span></p>`:'';

async function render(){try{const d=await api('/learner/data?userId='+encodeURIComponent(u.id));const A=d.assessments.filter(a=>{const s=d.submissions.find(x=>x.aid===a.id);return !(s&&s.mark!=null)}),S=d.submissions;
A.forEach(a=>{if(a.file)FILES[a.id]=a.file});
$('#list').innerHTML=A.length?A.map(a=>{const s=S.find(x=>x.aid===a.id),late=new Date(a.due)<new Date(),st=s?'<span class="tag">Submitted</span>':(late?'<span class="tag bad">Overdue</span>':'<span class="tag warn">Pending</span>');return `<div class="card"><div class="row"><h3>${esc(a.title)}</h3>${st}</div><p>${esc(a.desc)}</p><p class="m">Due: ${fmt(a.due)} · Total: ${a.total} marks</p>${viewBtn(a)}${s?`<p class="m">Submitted ${fmt(s.at)}${s.file&&s.file.name?' · '+esc(s.file.name):''}</p>`:''}<details><summary>${s?'Resubmit':'Submit work'}</summary><form data-id="${a.id}"><textarea name="t" placeholder="Comments / answer (optional)">${esc(s?s.text:'')}</textarea><input type="file" name="f"><button class="btn">Submit</button></form></details></div>`}).join(''):'<p class="m">Nothing waiting. Marked work is under My Marks.</p>'}catch(e){$('#list').innerHTML='<div class="card"><b>Unable to load assessments.</b><p>'+esc(e.message)+'</p></div>'}}
document.addEventListener('submit',async e=>{if(!e.target.matches('form[data-id]'))return;e.preventDefault();const f=e.target.elements;let file;try{file=await readFile(f.f.files[0])}catch(x){return alert(x)}try{await api('/submissions',{method:'POST',body:JSON.stringify({uid:u.id,aid:e.target.dataset.id,text:f.t.value,file})});alert('Submitted!');render()}catch(x){alert(x.message)}});render();
</script></body></html>
