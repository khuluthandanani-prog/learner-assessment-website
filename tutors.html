<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Tutors | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tiles.css"></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>JUNIOR TUTORS</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main><a class="back" href="lecturer.html">← Home</a><h2>Junior Tutors</h2><div id="list" class="boxes"></div></main>
<script src="app.js"></script><script>
const u=guard('admin');if(u&&u.role==='tutor')location.href='lecturer.html';
async function render(){try{const d=await api('/admin/tutors');$('#list').innerHTML=d.tutors.length?d.tutors.map(t=>{const st=t.status;return `<div class="card"><h3>${esc(t.name)}</h3><p>${esc(t.email)}</p><p><span class="tag ${st==='approved'?'ok':st==='pending'?'warn':'bad'}">${st}</span></p><p class="m">Assessments: ${t.assessments} · Marked: ${t.marked}</p><p class="m">Last login: ${fmt(t.lastLogin)}</p><p>${st!=='approved'?`<button class="btn sm" onclick="setSt('${t.id}','approved')">${st==='pending'?'Approve':'Unblock'}</button>`:`<button class="btn sm ghost" onclick="setSt('${t.id}','blocked')">Block</button>`} <button class="btn sm ghost" onclick="del('${t.id}')">Delete</button></p></div>`}).join(''):'<p class="m">No junior tutors registered yet.</p>'}catch(e){$('#list').innerHTML='<div class="card"><b>Unable to load.</b><p>'+esc(e.message)+'</p></div>'}}
async function setSt(id,status){try{await api('/admin/tutors/'+id,{method:'PATCH',body:JSON.stringify({status})});render()}catch(e){alert(e.message)}}
async function del(id){if(!confirm('Delete this tutor?'))return;try{await api('/admin/tutors/'+id,{method:'DELETE'});render()}catch(e){alert(e.message)}}
render();
</script></body></html>
