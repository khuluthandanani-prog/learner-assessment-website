<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutoring Teachers | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tiles.css"></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>TUTORING TEACHERS</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main><a class="back" href="lecturer.html">← Home</a><h2>Tutoring Teachers</h2><div id="list" class="boxes"></div></main>
<script src="app.js"></script><script>
const u=guard('admin');if(u&&u.role==='tutor')location.href='lecturer.html';
let T=[],SUBJ=[];
api('/subjects').then(d=>SUBJ=d.subjects.map(s=>s.name)).catch(()=>{});
async function render(){try{const d=await api('/admin/tutors');T=d.tutors;$('#list').innerHTML=T.length?T.map(t=>{const st=t.status;const sc=t.schools||[];return `<div class="card"><h3>${esc(t.name)}</h3><p>${esc(t.email)}</p><p><b>Subjects: ${esc((t.subjects||[]).join(', ')||'none yet')}</b></p><p>${sc.length?'<b>Schools: '+sc.map(esc).join('; ')+'</b>':'<span class="tag bad">No schools yet</span>'}</p><p class="m">${esc(t.district||'—')} · ${esc(t.province||'—')}</p><p><span class="tag ${st==='approved'?'ok':st==='pending'?'warn':'bad'}">${st}</span></p><p class="m">Learners: ${t.learners||0} · Assessments: ${t.assessments} · Marked: ${t.marked}</p><p class="m">Last login: ${fmt(t.lastLogin)}</p><p>${st!=='approved'?`<button class="btn sm" onclick="setSt('${t.id}','approved')">${st==='pending'?'Approve':'Unblock'}</button>`:`<button class="btn sm ghost" onclick="setSt('${t.id}','blocked')">Block</button>`} <button class="btn sm ghost" onclick="editSub('${t.id}')">Edit subjects</button> <button class="btn sm ghost" onclick="editSchools('${t.id}')">Edit schools</button> <button class="btn sm ghost" onclick="del('${t.id}')">Delete</button></p></div>`}).join(''):'<p class="m">No tutoring teachers registered yet.</p>'}catch(e){$('#list').innerHTML='<div class="card"><b>Unable to load.</b><p>'+esc(e.message)+'</p></div>'}}
async function setSt(id,status){try{await api('/admin/tutors/'+id,{method:'PATCH',body:JSON.stringify({status})});render()}catch(e){alert(e.message)}}
async function editSub(id){const t=T.find(x=>x.id===id);const v=prompt('Subjects, separated by commas. Available: '+SUBJ.join(', '),((t&&t.subjects)||[]).join(', '));if(v===null)return;try{await api('/admin/users/'+id+'/subjects',{method:'PATCH',body:JSON.stringify({subjects:v.split(',').map(s=>s.trim()).filter(Boolean)})});render()}catch(e){alert(e.message)}}
async function editSchools(id){const t=T.find(x=>x.id===id);const province=prompt('Province where this tutoring teacher teaches:',(t&&t.province)||'');if(province===null)return;const district=prompt('District:',(t&&t.district)||'');if(district===null)return;const v=prompt('School(s) this tutoring teacher teaches at. Maximum 2. Separate two schools with a semicolon ( ; ):',((t&&t.schools)||[]).join('; '));if(v===null)return;try{await api('/admin/tutors/'+id+'/schools',{method:'PATCH',body:JSON.stringify({province,district,schools:v.split(';').map(s=>s.trim()).filter(Boolean)})});render()}catch(e){alert(e.message)}}
async function del(id){if(!confirm('Delete this tutoring teacher?'))return;try{await api('/admin/tutors/'+id,{method:'DELETE'});render()}catch(e){alert(e.message)}}
render();
</script></body></html>
