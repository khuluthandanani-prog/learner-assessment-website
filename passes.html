<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day Passes | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>DAY PASSES</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main><a href="lecturer.html" style="display:inline-block;margin:0 0 14px">← Home</a><h2>Day Passes</h2><p class="m" id="info"></p><div id="list"></div></main>
<script src="app.js"></script><script>
const u=guard('admin');if(u&&u.role!=='admin')location.href='lecturer.html';
async function render(){try{const d=await api('/admin/passes');$('#info').textContent='Price: R'+d.price+' · Pass length: '+d.hours+' hours. Confirm a request only after you see the payment.';
$('#list').innerHTML=d.passes.length?`<div class="card"><div class="table"><table><tr><th>Learner</th><th>Email</th><th>Reference</th><th>Amount</th><th>Status</th><th>Requested</th><th>Expires</th><th>Actions</th></tr>${d.passes.map(p=>{const st=p.status;return `<tr><td>${esc(p.name)}</td><td>${esc(p.email)}</td><td><b>${esc(p.reference)}</b></td><td>R${esc(p.amount)}</td><td><span class="tag ${st==='active'?'ok':st==='pending'?'warn':'bad'}">${st}</span></td><td>${fmt(p.requestedAt)}</td><td>${p.expiresAt?fmt(p.expiresAt):'—'}</td><td>${st==='pending'?`<button class="btn sm" onclick="act('${p.id}','confirm')">Confirm payment</button> <button class="btn sm ghost" onclick="act('${p.id}','reject')">Reject</button>`:''}${st==='active'?`<button class="btn sm ghost" onclick="act('${p.id}','revoke')">Revoke</button>`:''}</td></tr>`}).join('')}</table></div></div>`:'<p class="m">No day pass requests.</p>'}catch(e){$('#list').innerHTML='<div class="card"><b>Unable to load.</b><p>'+esc(e.message)+'</p></div>'}}
async function act(id,action){try{await api('/admin/passes/'+id,{method:'PATCH',body:JSON.stringify({action})});render()}catch(e){alert(e.message);render()}}
render();
</script></body></html>
