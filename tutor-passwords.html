<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutor Passwords | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tiles.css"></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>TUTOR PASSWORDS</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main>
<a class="back" href="lecturer.html">← Home</a><h2>Tutor passwords</h2>
<p class="m">Press <b>Reset password</b> next to a tutor, type a new password (6 or more characters), or leave the box empty to make a random one. The old password stops working at once. Give the new password to the tutor yourself.</p>
<input id="q" placeholder="Search by name or email" style="width:100%;max-width:420px;box-sizing:border-box;padding:8px;margin:8px 0">
<div id="msg"></div>
<div id="list"></div>
</main>
<script src="app.js"></script><script>
const u=guard('admin');
if(u&&!['admin','lecturer'].includes(u.role)){location.href='lecturer.html'}
let T=[];

function randomPw(){
 const chars='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';
 const a=new Uint32Array(10);crypto.getRandomValues(a);
 return [...a].map(n=>chars[n%chars.length]).join('');
}

async function load(){
 try{
  const d=await api('/admin/tutors');
  T=d.tutors||[];
  draw();
 }catch(e){$('#msg').innerHTML='<div class="card"><b>Unable to load.</b><p>'+esc(e.message)+'</p></div>'}
}

function draw(){
 const q=$('#q').value.trim().toLowerCase();
 const L=T.filter(t=>!q||String(t.name).toLowerCase().includes(q)||String(t.email).toLowerCase().includes(q));
 $('#list').innerHTML=L.length
  ?'<div class="card"><div class="table"><table><tr><th>Name</th><th>Email</th><th>Subjects</th><th>Status</th><th></th></tr>'
   +L.map(t=>'<tr><td><b>'+esc(t.name)+'</b></td><td>'+esc(t.email)+'</td><td>'+esc((t.subjects||[]).join(', ')||'none yet')+'</td>'
   +'<td><span class="tag '+(t.status==='approved'?'ok':t.status==='pending'?'warn':'bad')+'">'+esc(t.status)+'</span></td>'
   +'<td><button class="btn sm" onclick="reset(\''+esc(t.id)+'\')">Reset password</button></td></tr>').join('')
   +'</table></div></div>'
  :'<p class="m">No tutors found.</p>';
}

async function reset(id){
 const t=T.find(x=>x.id===id);if(!t)return;
 let p=prompt('New password for '+t.name+' (6 or more characters).\nLeave empty to make a random one:');
 if(p===null)return;
 p=p.trim();
 if(!p)p=randomPw();
 if(p.length<6)return alert('Too short. Use at least 6 characters.');
 try{
  await api('/admin/tutors/'+id+'/password',{method:'PATCH',body:JSON.stringify({password:p})});
  alert('Password changed for '+t.name+'.\n\nNew password: '+p+'\n\nGive it to the tutor now. It is not shown again.');
 }catch(e){alert(e.message)}
}
$('#q').oninput=draw;
load();
</script></body></html>
