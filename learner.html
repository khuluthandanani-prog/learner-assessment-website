<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learner | RISE COLLECTIVE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tiles.css"></head><body>
<header class="top"><div class="brand"><span class="logo"></span><div>RISE COLLECTIVE<small>LEARNER PORTAL</small></div></div><div>👤 <span id="who"></span> <button class="btn sm" onclick="logout()">Logout</button></div></header><main><h2>Welcome</h2>
<div class="tiles">
<a class="tile" href="learner-assessments.html"><span class="ico">📝</span><div><div class="count" id="cPending">–</div><h3>Assessments</h3><p>View and submit your work</p></div></a>
<a class="tile" href="learner-marks.html"><span class="ico">🏆</span><div><div class="count" id="cMarked">–</div><h3>My Marks</h3><p>Results and feedback</p></div></a>
<a class="tile" href="learner-notes.html"><span class="ico">🎥</span><div><h3>Notes &amp; Videos</h3><p>Study material for your course</p></div></a>
</div></main>
<script src="app.js"></script><script>
const u=guard('learner');
(async()=>{try{const d=await api('/learner/data?userId='+encodeURIComponent(u.id));const A=d.assessments,S=d.submissions;
const marked=S.filter(s=>s.mark!=null).length;$('#cMarked').textContent=marked;$('#cPending').textContent=A.length-marked}catch(e){}})();
</script></body></html>
