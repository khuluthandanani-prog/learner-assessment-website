```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RISE COLLECTIVE Portal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login">

  <div class="logo big"></div>

  <h1>RISE COLLECTIVE</h1>
  <p class="m">Assessment Portal</p>

  <div class="card">

    <div class="tabs">
      <button type="button" class="on" data-t="l">Login</button>
      <button type="button" data-t="r">Register</button>
    </div>


    <!-- LOGIN -->

    <form id="lf">

      <label>Email</label>

      <input
        name="email"
        type="email"
        required
      >

      <label>Password</label>

      <input
        name="pass"
        type="password"
        required
      >

      <button
        type="submit"
        class="btn"
        style="width:100%"
      >
        Login
      </button>

    </form>


    <!-- REGISTER -->

    <form id="rf" hidden>

      <label>Full name</label>

      <input
        name="name"
        required
      >

      <label>Email</label>

      <input
        name="email"
        type="email"
        required
      >

      <label>Password</label>

      <input
        name="pass"
        type="password"
        minlength="6"
        required
      >

      <label>I am a</label>

      <select name="role">

        <option value="learner">
          Learner
        </option>

        <option value="lecturer">
          Lecturer / Admin
        </option>

      </select>


      <div id="cd" hidden>

        <label>Lecturer access code</label>

        <input
          name="code"
          placeholder="Ask the administrator"
        >

      </div>


      <button
        type="submit"
        class="btn"
        style="width:100%"
      >
        Create account
      </button>

    </form>

  </div>

</div>




<script>

const API =
  "https://rise-collective-assessments-api.onrender.com";

const CODE = "RISE2026";


/* LOGIN / REGISTER TABS */

function show(type) {

  document.getElementById("lf").hidden =
    type !== "l";

  document.getElementById("rf").hidden =
    type !== "r";

  document.querySelectorAll(".tabs button")
    .forEach(button => {

      button.classList.toggle(
        "on",
        button.dataset.t === type
      );

    });

}


/* TAB BUTTONS */

document.querySelectorAll(".tabs button")
  .forEach(button => {

    button.addEventListener(
      "click",
      function () {

        show(this.dataset.t);

      }
    );

  });


/* LECTURER CODE */

document.querySelector(
  '#rf select[name="role"]'
).addEventListener(
  "change",
  function () {

    document.getElementById("cd").hidden =
      this.value !== "lecturer";

  }
);


/* =========================
   LOGIN
   ========================= */

document.getElementById("lf")
  .addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();

      const email =
        this.elements.email.value
          .trim()
          .toLowerCase();

      const password =
        this.elements.pass.value;


      try {

        const response =
          await fetch(
            API + "/api/login",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                email: email,
                password: password
              })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          alert(
            result.message ||
            "Login failed."
          );

          return;

        }


        localStorage.setItem(
          "rise_session",
          JSON.stringify({
            id: result.user.id,
            name: result.user.name,
            email: result.user.email,
            role: result.user.role
          })
        );


        if (result.user.role === "learner") {

          window.location.href =
            "learner.html";

        } else {

          window.location.href =
            "lecturer.html";

        }

      }

      catch (error) {

        console.error(error);

        alert(
          "Unable to connect to the login server."
        );

      }

    }
  );


/* =========================
   REGISTRATION
   ========================= */

document.getElementById("rf")
  .addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();

      const name =
        this.elements.name.value.trim();

      const email =
        this.elements.email.value
          .trim()
          .toLowerCase();

      const password =
        this.elements.pass.value;

      const role =
        this.elements.role.value;


      if (
        role === "lecturer" &&
        this.elements.code.value !== CODE
      ) {

        alert(
          "Invalid lecturer code."
        );

        return;

      }


      try {

        const response =
          await fetch(
            API + "/api/register",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                name: name,
                email: email,
                password: password,
                role: role
              })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          alert(
            result.message ||
            "Registration failed."
          );

          return;

        }


        alert(result.message);

        this.reset();

        show("l");

      }

      catch (error) {

        console.error(error);

        alert(
          "Unable to connect to the registration server."
        );

      }

    }
  );

</script>

</body>
</html>
```
